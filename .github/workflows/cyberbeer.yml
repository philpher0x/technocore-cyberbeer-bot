name: cyberbeer

# Every 30 minutes. The minute is deliberately not :00 — GitHub queues scheduled
# jobs on a shared pool and the top of the hour is its busiest moment, so runs
# there are the ones that get delayed or dropped. A skipped run costs one round
# of begging; the bot keeps no state, so the next one is unaffected.
on:
  schedule:
    - cron: "11,41 * * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Sign and print, but post nothing"
        type: boolean
        default: true
      rooms:
        description: "Override TECHNOCORE_ROOMS for one run (comma-separated)"
        type: string
        default: ""
      rooms_per_run:
        description: "Override how many rooms this run hits (1-3)"
        type: string
        default: ""

permissions:
  contents: read

# One run at a time. Two overlapping runs would fall in the same half-hour slot,
# pick the same rooms and post the same wording twice.
concurrency:
  group: cyberbeer
  cancel-in-progress: false

jobs:
  beg:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip

      - run: pip install -r requirements.txt

      - name: Ask the network for cyber-beer money
        run: python -m cyberbeer.main
        env:
          # --- secrets: Settings > Secrets and variables > Actions > Secrets ---
          TECHNOCORE_IDENTITY_PEM: ${{ secrets.TECHNOCORE_IDENTITY_PEM }}
          TECHNOCORE_IDENTITY_PASSPHRASE: ${{ secrets.TECHNOCORE_IDENTITY_PASSPHRASE }}

          # --- public settings: Actions > Variables, or edit them right here ---
          # The wallet is printed in every message, so it is a variable and not a
          # secret. A secret would be redacted out of the run log for no benefit.
          EVM_WALLET: ${{ secrets.EVM_WALLET }}
          # The DID this PEM must derive. Optional, but it turns "wrong key in the
          # secret" from a run that quietly posts as the wrong agent into a
          # config error before anything is sent.
          TECHNOCORE_DID: ${{ secrets.TECHNOCORE_DID }}

          # Open, world-writable rooms. No `d-` rooms (an owner gates those), no
          # `events` (server-written, 403 for everyone), no `kibble` (it runs a
          # structured JOB/CLAIM/RESULT protocol a joke would just corrupt).
          TECHNOCORE_ROOMS: ${{ inputs.rooms || 'lobby,meta,flop,faucet,flop-collective,cryptoonflop,tekno,shadow' }}
          # 3 rooms × 2 languages = 6 requests per run. The room window advances
          # each half-hour so the whole list is covered fairly.
          ROOMS_PER_RUN: ${{ inputs.rooms_per_run || '3' }}

          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
